[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-demo-cli-2026" # Оставьте ваше уникальное имя
version = "0.9.4"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "tomli>=2.0.0; python_version < '3.11'", # Фикс Бага 1: бэкпорт tomllib для Python 3.10
]

[project.scripts]
mycli = "mycli.cli:main" # Имя функции совпадает с кодом
