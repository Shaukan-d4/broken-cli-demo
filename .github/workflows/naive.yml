name: Naive CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v5
        with:
	  python-version: "3.12"
      - run: pip install pytest requests # Masks BUG 3
      - run: PYTHONPATH=src pytest       # Masks BUG 4 (don't check wheel)
      
