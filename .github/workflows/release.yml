name: Strict Release Pipeline
on:
  push:
    branches:
    tags: ['v*']

jobs:
  # 1. Lint and Checking in Docker
  lint-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff build
      - run: ruff check src build
      - run: python -m build
      - run: docker build -t cli-test . && docker run --rm cli-test

   #2. OS Matrix and python version + wheel testing
   test-matrix:
     strategy:
       fail-fast: false
       matrix:
         os: [ubuntu-latest, windows-latest]
         python-version: ["3.10","3.12"]
     runs-on: ${{ matrix.os }}
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-python@v5
         with:
           python-version: ${{ matrix.python-version }}
       - name: Build wheel
         run: pip install build && python -m build
       - name: Install wheel in clean env (no src access)
         run: |
           pip install dist/*.whl
           cd ..
           mycli --help # Checking in real CLI run..

      #3. Publication in TestPyPI on tag through OIDC
      publish:
        needs: [lint-and-docker, test-matrix]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment: testpypi
        permissions:
          id-token: write #Neccesssarily for OIDC
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-python@v5
            with:
              python-version: "3.12"
          - run: pip install build && python -m build
          - uses: pypa/gh-action-pypi-publish@release/v1
            with:
              repository-url: https://test.pypi.org/legacy/
